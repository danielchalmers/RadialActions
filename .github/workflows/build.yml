name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/full-build

  # The same build and tests, natively on Arm64.
  build-test-arm64:
    name: Build and test arm64
    runs-on: windows-11-arm
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Build and test
        shell: bash
        run: dotnet test

  smoke-test:
    name: Smoke test ${{ matrix.arch }}
    needs: build
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-2025
          - arch: arm64
            runner: windows-11-arm
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v8
        with:
          name: artifact
          path: artifact

      - uses: ./.github/actions/smoke-test
        with:
          msi: artifact/RadialActions-0.0.0-${{ matrix.arch }}.msi
          exe: '%LOCALAPPDATA%\RadialActions\RadialActions\RadialActions.exe'
